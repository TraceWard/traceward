name: Managed runtime
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  native-tests:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dashboard]' httpx
      - run: docker build -t ghcr.io/traceward/runner:0.2.0 -f src/traceward/runner_image/Dockerfile .
      - run: python -m unittest discover -s tests -q
        env:
          TRACEWARD_TEST_DOCKER: '1'
  publish:
    needs: native-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/traceward/runner_image/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/traceward/runner:0.2.0
