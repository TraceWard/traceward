[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "traceward"
version = "0.2.0"
description = "Goal-first observability for Codex in a managed gVisor runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["protobuf==6.33.5"]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
traceward = "traceward.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traceward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
